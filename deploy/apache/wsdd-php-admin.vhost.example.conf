<VirtualHost *:80>
    ServerName phpadmin.example.internal

    ErrorLog /var/log/apache2/wsdd-php-admin-error.log
    CustomLog /var/log/apache2/wsdd-php-admin-access.log combined

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8989/
    ProxyPassReverse / http://127.0.0.1:8989/
</VirtualHost>
